<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Ludo</title>
    <style>
        body { background: #121214; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .glass-box { background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); margin-top: 50px; }
        input { padding: 15px; width: 80%; border-radius: 10px; border: none; font-size: 18px; text-align: center; margin-bottom: 20px;}
        button { padding: 15px 30px; border-radius: 10px; border: none; background: #007BFF; color: white; font-size: 18px; font-weight: bold; cursor: pointer; width: 85%;}
        #diceArea { margin-top: 30px; }
        #diceResult { font-size: 80px; margin: 20px; text-shadow: 0 0 20px #00FFFF; }
        .hidden { display: none; }
        h1 { color: #00FFFF; }
        .player-list { margin-top: 20px; text-align: left; background: #222; padding: 10px; border-radius: 10px;}
        .player-name { font-size: 18px; color: #00FF00; margin: 5px 0;}
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="glass-box">
        <h1>JOIN LUDO</h1>
        <p>You are joining Chatroom Ludo</p>
        <input type="text" id="playerName" placeholder="Enter your display name" maxlength="15">
        <button onclick="joinGame()">ENTER GAME</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="glass-box hidden">
        <h2 id="roomTitle">Room</h2>
        
        <div class="player-list">
            <h3>Players Inside:</h3>
            <div id="playersDiv"></div>
        </div>

        <div id="diceArea">
            <div id="diceResult">🎲</div>
            <button onclick="rollDice()">ROLL DICE</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDN3gmMK-wrOV2VsLS1F-vGsijahPkTG4g",
            authDomain: "ludo-e8ffb.firebaseapp.com",
            projectId: "ludo-e8ffb",
            databaseURL: "https://ludo-e8ffb-default-rtdb.firebaseio.com/",
            storageBucket: "ludo-e8ffb.firebasestorage.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // GET ROOM ID FROM URL (?room=12345)
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || "public_room";
        
        let myName = "";

        // JOIN BUTTON CLICK
        function joinGame() {
            myName = document.getElementById("playerName").value.trim();
            if (myName === "") { alert("Please enter your name!"); return; }

            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("gameScreen").classList.remove("hidden");
            document.getElementById("roomTitle").innerText = "Ludo Room: " + roomId;

            // Add player to Firebase Room
            const playerRef = db.ref("rooms/" + roomId + "/players").push();
            playerRef.set({ name: myName });

            // Remove player when they close the game
            playerRef.onDisconnect().remove();

            listenToRoom();
        }

        // ROLL DICE
        function rollDice() {
            let randomDice = Math.floor(Math.random() * 6) + 1;
            
            // Save dice roll and WHO rolled it to Firebase
            db.ref("rooms/" + roomId + "/game").update({
                dice_value: randomDice,
                rolled_by: myName,
                timestamp: Date.now()
            });
        }

        // LISTEN TO REALTIME CHANGES
        function listenToRoom() {
            // Listen to Players List
            db.ref("rooms/" + roomId + "/players").on("value", (snapshot) => {
                let playersDiv = document.getElementById("playersDiv");
                playersDiv.innerHTML = ""; // Clear list
                snapshot.forEach((child) => {
                    let pName = child.val().name;
                    playersDiv.innerHTML += `<div class="player-name">👤 ${pName}</div>`;
                });
            });

            // Listen to Dice Rolls
            db.ref("rooms/" + roomId + "/game").on("value", (snapshot) => {
                let data = snapshot.val();
                if (data && data.dice_value) {
                    document.getElementById("diceResult").innerText = data.dice_value;
                    // Flash effect to show dice changed
                    document.getElementById("diceResult").style.color = "#FF007F";
                    setTimeout(() => document.getElementById("diceResult").style.color = "white", 500);
                }
            });
        }
    </script>
</body>
</html>
