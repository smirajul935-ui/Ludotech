<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Ludo</title>
    <style>
        body { background: #121214; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .glass-box { background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); margin-top: 50px; box-shadow: 0 0 20px rgba(0,255,255,0.1); }
        input { padding: 15px; width: 80%; border-radius: 10px; border: none; font-size: 18px; text-align: center; margin-bottom: 20px; font-weight: bold;}
        button { padding: 15px 30px; border-radius: 10px; border: none; background: linear-gradient(90deg, #00C6FF, #0072FF); color: white; font-size: 18px; font-weight: bold; width: 85%; margin: 10px 0; cursor: pointer; }
        button.red { background: linear-gradient(90deg, #FF0044, #990000); }
        #diceArea { margin-top: 40px; }
        #diceResult { font-size: 80px; margin: 20px; text-shadow: 0 0 20px #00FFFF; }
        .hidden { display: none; }
        h1 { color: #00FFFF; text-shadow: 0 0 10px rgba(0,255,255,0.5); }
    </style>
</head>
<body>

    <!-- LOBBY SCREEN -->
    <div id="lobbyScreen" class="glass-box">
        <h1>🎲 PREMIUM LUDO</h1>
        <p>Create or Join a Room (5 Digit Code)</p>
        
        <button onclick="createRoom()">CREATE ROOM (Host)</button>
        
        <hr style="border-color: #333; margin: 30px 0;">
        
        <input type="number" id="roomCodeInput" placeholder="Enter 5-Digit Code" maxlength="5">
        <button class="red" onclick="joinRoom()">JOIN ROOM</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="glass-box hidden">
        <h1>ROOM: <span id="displayRoomCode" style="color: #FF007F;"></span></h1>
        <p id="statusMsg">Waiting for Host to start...</p>
        
        <!-- Only Host can see this button initially -->
        <button id="startBtn" class="hidden" onclick="startGame()">▶ START GAME</button>
        
        <div id="diceArea" class="hidden">
            <div id="diceResult">🎲</div>
            <button onclick="rollDice()">ROLL DICE</button>
        </div>
    </div>

    <!-- Firebase SDKs (Compat version is easier for pure HTML) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        // Your Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDN3gmMK-wrOV2VsLS1F-vGsijahPkTG4g",
            authDomain: "ludo-e8ffb.firebaseapp.com",
            projectId: "ludo-e8ffb",
            databaseURL: "https://ludo-e8ffb-default-rtdb.firebaseio.com/",
            storageBucket: "ludo-e8ffb.firebasestorage.app",
            messagingSenderId: "7664555721",
            appId: "1:7664555721:web:9c62b81a2d95caa1401f18"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myRoomCode = "";
        let isHost = false;

        // 1. CREATE ROOM (HOST)
        function createRoom() {
            // Generate Random 5 digit code
            myRoomCode = Math.floor(10000 + Math.random() * 90000).toString();
            isHost = true;
            
            // Save to Realtime Database
            db.ref("rooms/" + myRoomCode).set({
                status: "waiting",
                players: 1,
                dice_value: 0
            });

            document.getElementById("lobbyScreen").classList.add("hidden");
            document.getElementById("gameScreen").classList.remove("hidden");
            document.getElementById("displayRoomCode").innerText = myRoomCode;
            document.getElementById("startBtn").classList.remove("hidden"); // Host can start
            
            listenToRoom();
        }

        // 2. JOIN ROOM (FRIEND)
        function joinRoom() {
            let inputCode = document.getElementById("roomCodeInput").value;
            if (inputCode.length !== 5) {
                alert("Please enter a valid 5-digit code.");
                return;
            }

            db.ref("rooms/" + inputCode).once("value").then((snapshot) => {
                if (snapshot.exists()) {
                    let data = snapshot.val();
                    if(data.status === "waiting") {
                        myRoomCode = inputCode;
                        db.ref("rooms/" + myRoomCode).update({ players: data.players + 1 });
                        
                        document.getElementById("lobbyScreen").classList.add("hidden");
                        document.getElementById("gameScreen").classList.remove("hidden");
                        document.getElementById("displayRoomCode").innerText = myRoomCode;
                        
                        listenToRoom();
                    } else {
                        alert("Game already started!");
                    }
                } else {
                    alert("Room not found!");
                }
            });
        }

        // 3. START GAME (Only Host)
        function startGame() {
            db.ref("rooms/" + myRoomCode).update({ status: "playing" });
            document.getElementById("startBtn").classList.add("hidden");
        }

        // 4. ROLL DICE
        function rollDice() {
            // Random 1 to 6
            let randomDice = Math.floor(Math.random() * 6) + 1;
            
            // Update Firebase
            db.ref("rooms/" + myRoomCode).update({
                dice_value: randomDice,
                timestamp: Date.now() // to force update even if same number comes twice
            });
        }

        // 5. LISTEN TO FIREBASE REALTIME CHANGES
        function listenToRoom() {
            db.ref("rooms/" + myRoomCode).on("value", (snapshot) => {
                let data = snapshot.val();
                if (!data) return;

                // Check Game Status
                if (data.status === "playing") {
                    document.getElementById("statusMsg").innerText = "Game Started! Players: " + data.players;
                    document.getElementById("diceArea").classList.remove("hidden");
                    document.getElementById("startBtn").classList.add("hidden");
                }

                // Update Dice UI
                if (data.dice_value > 0) {
                    document.getElementById("diceResult").innerText = data.dice_value;
                }
            });
        }
    </script>
</body>
</html>
