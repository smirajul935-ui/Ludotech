<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SagarTech99 Ludo</title>
    <style>
        body { 
            background: #0A0A0A; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
        }
        .glass-box { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px); 
            padding: 30px; 
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            margin: 50px auto;
            width: 85%; 
            max-width: 400px;
        }
        .brand { color: #00FFFF; font-size: 28px; font-weight: bold; margin-bottom: 5px; }
        input { 
            padding: 15px; width: 85%; border-radius: 12px; border: 1px solid #00FFFF; 
            background: rgba(0,0,0,0.5); color: #00FFFF; font-size: 16px; text-align: center; margin-bottom: 20px; outline: none;
        }
        button { 
            padding: 15px; border-radius: 12px; border: none; 
            background: linear-gradient(45deg, #FF007F, #7F00FF); 
            color: white; font-size: 16px; font-weight: bold; cursor: pointer; width: 95%; 
        }
        button:active { transform: scale(0.95); }
        .hidden { display: none !important; }
        
        /* Ludo Board Area */
        #ludoBoardArea {
            position: relative;
            width: 100vw;
            max-width: 500px;
            margin: auto;
        }
        #ludoBoardImg {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* Dice Container at the bottom */
        #diceArea { 
            background: #1C1D22;
            padding: 20px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            position: fixed;
            bottom: 0;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }
        #diceResult { 
            font-size: 60px; margin: 10px auto; width: 80px; height: 80px; 
            line-height: 80px; background: rgba(255,255,255,0.1); border-radius: 15px;
            box-shadow: 0 0 15px #00FFFF; transition: 0.2s;
        }
        .rolling { animation: spin 0.3s infinite linear; color: #FF007F; }
        @keyframes spin { 100% { transform: rotate(360deg) scale(1.1); } }
        #turnMsg { color: #00FF00; margin-bottom: 10px; font-weight: bold; font-size: 14px;}
        .player-info { color: #aaa; font-size: 12px; margin-bottom: 5px;}
    </style>
</head>
<body>

    <!-- SCREEN 1: LOGIN -->
    <div id="loginScreen" class="glass-box">
        <div class="brand">SagarTech99</div>
        <p>Welcome to Room Ludo</p>
        <input type="text" id="playerName" placeholder="Enter your Game Name" maxlength="12">
        <button onclick="joinGame()">ENTER LUDO</button>
    </div>

    <!-- SCREEN 2: GAME BOARD -->
    <div id="gameScreen" class="hidden">
        
        <div id="ludoBoardArea">
            <!-- Professional Ludo Board Image -->
            <img id="ludoBoardImg" src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/Ludo_board.svg/1024px-Ludo_board.svg.png" alt="Ludo Board">
        </div>

        <!-- Dice Control at Bottom -->
        <div id="diceArea">
            <div class="player-info">Playing as: <span id="myNameDisplay" style="color:white;font-weight:bold;"></span></div>
            <div id="turnMsg">Waiting for dice roll...</div>
            <div id="diceResult">🎲</div>
            <button onclick="rollDice()">ROLL DICE</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        // 🔴 FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyDN3gmMK-wrOV2VsLS1F-vGsijahPkTG4g",
            authDomain: "ludo-e8ffb.firebaseapp.com",
            projectId: "ludo-e8ffb",
            databaseURL: "https://ludo-e8ffb-default-rtdb.firebaseio.com/",
            storageBucket: "ludo-e8ffb.firebasestorage.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // INJECTED FROM JAVA AIDE
        let roomId = "INJECTED_ROOM_ID"; 
        if(roomId === "INJECTED_ROOM_ID") roomId = "TestRoom"; // Browser test fallback

        let myName = "";

        // JOIN GAME
        function joinGame() {
            myName = document.getElementById("playerName").value.trim();
            if (myName === "") { alert("Please enter your name!"); return; }

            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("gameScreen").classList.remove("hidden");
            document.getElementById("myNameDisplay").innerText = myName;

            listenToDice();
        }

        // ROLL DICE (Send to Firebase)
        function rollDice() {
            // Generate Random Dice 1-6
            let diceVal = Math.floor(Math.random() * 6) + 1;
            
            // Send roll event to the specific Room in Firebase
            db.ref("rooms/" + roomId + "/dice_event").set({
                number: diceVal,
                player: myName,
                time: Date.now() // Unique timestamp forces update every time
            });
        }

        // LISTEN TO FIREBASE DICE ROLLS
        function listenToDice() {
            const diceUi = document.getElementById("diceResult");
            const msgUi = document.getElementById("turnMsg");

            db.ref("rooms/" + roomId + "/dice_event").on("value", snapshot => {
                let data = snapshot.val();
                if (data && data.number) {
                    
                    // Show Rolling Animation
                    diceUi.classList.add("rolling");
                    diceUi.innerText = "🎲";
                    msgUi.innerText = `${data.player} is rolling...`;

                    // After 0.5s stop animation and show result
                    setTimeout(() => {
                        diceUi.classList.remove("rolling");
                        
                        // Map numbers to dice emoji for premium look
                        const diceEmojis = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
                        diceUi.innerText = diceEmojis[data.number - 1]; 
                        
                        msgUi.innerText = `${data.player} got ${data.number}!`;
                    }, 500);
                }
            });
        }
    </script>
</body>
</html>
